name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Backs tests/test_ratelimit_storage.py's real Redis-backed rate-limit
    # coverage — a config-key typo once made RATE_LIMIT_STORAGE_URI silently
    # do nothing (Flask-Limiter fell back to in-memory storage with no
    # error), which only a real Redis wire-protocol server behind it could
    # have caught. Without TEST_REDIS_URL below, those tests just skip.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check (py_compile)
        run: python -m compileall -q app

      # SECRET_KEY has a test-only fallback in tests/conftest.py, but it's
      # set explicitly here too so a stray import of app.config outside a
      # test context (e.g. a future script) doesn't fail startup in CI.
      #
      # PYTEST_DISABLE_PLUGIN_AUTOLOAD is required: `web3` ships a pytest
      # plugin (web3.tools.pytest_ethereum) that pytest auto-loads via
      # setuptools entry points at startup, unrelated to anything we use —
      # and it's broken against the eth-typing version requirements.txt
      # resolves (`ImportError: cannot import name 'ContractName'`), which
      # crashes pytest before a single test file is even collected. This
      # disables auto-loading of third-party plugins only — pytest's own
      # built-in plugins are unaffected. Needed for local runs too.
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-real-use
          JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-real-use
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          TEST_REDIS_URL: redis://localhost:6379
        run: pytest

  frontend:
    name: Frontend (typecheck + lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (real chain, real backend, real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # anvil — a local, empty, throwaway EVM chain (chain-id matches
      # Sepolia's real one) the e2e suite deploys real contracts against
      # instead of a public testnet. See frontend/e2e/README.md.
      - uses: foundry-rs/foundry-toolchain@v1

      # solana-test-validator — the equivalent local chain for the Solana
      # (Candy Machine) e2e coverage. No maintained setup-solana action
      # exists as of writing, so this installs the same way the local dev
      # instructions do and adds it to PATH for the rest of the job.
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/candy-machine/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install candy-machine sidecar dependencies
        working-directory: services/candy-machine
        run: npm ci

      # GitHub's runners already have passwordless sudo, so --with-deps
      # (which apt-installs Chromium's shared libraries) works unattended
      # here — unlike a local dev machine, where that step needs a human
      # to type a password (see frontend/e2e/README.md).
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  candy-machine:
    name: Candy Machine sidecar (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/candy-machine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/candy-machine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Docker (build every image, boot the production stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same files deploy/bootstrap.sh writes on a server, with throwaway
      # values. DOMAIN=localhost makes Caddy serve HTTPS from its own local CA.
      - name: Write env files
        run: |
          secret() { openssl rand -hex 32; }
          shared=$(secret)
          printf 'DOMAIN=localhost\nPOSTGRES_PASSWORD=%s\n' "$(secret)" > deploy/.env
          printf 'SECRET_KEY=%s\nJWT_SECRET_KEY=%s\nCANDY_MACHINE_SHARED_SECRET=%s\n' "$(secret)" "$(secret)" "$shared" > backend/.env
          printf 'PORT=4000\nCANDY_MACHINE_SHARED_SECRET=%s\n' "$shared" > services/candy-machine/.env

      - name: Build and start
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build --wait --wait-timeout 300

      - name: Check it through Caddy, as a browser would
        run: |
          set -x
          # Readiness: database migrated and reachable, sidecar reachable.
          curl -kfsS https://localhost/api/health/ready | grep '"status":"ok"'
          # The frontend bundle, and a client-side route falling back to it.
          curl -kfsS https://localhost/ | grep '<div id="root">'
          curl -kfsS https://localhost/tokens | grep '<div id="root">'
          # A real compile with the solc baked into the image.
          curl -kfsS https://localhost/api/contracts/compile -H 'Content-Type: application/json' \
            -d '{"template_id":"erc20_basic","parameters":{"TOKEN_NAME":"CI","TOKEN_SYMBOL":"CI","TOKEN_DECIMALS":18,"TOKEN_SUPPLY":1000}}' \
            | grep '"bytecode":"0x'
          # Nothing but Caddy is reachable from outside.
          for port in 5000 5432 6379 4000 8080; do
            ! curl -s -m 2 "http://localhost:$port" >/dev/null
          done
          # The scheduler ran a maintenance round against the migrated database.
          sleep 5
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env logs scheduler | grep -i prune

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env logs --tail 200

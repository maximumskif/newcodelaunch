# react-router-dom uses client-side routing (see App.tsx) — without the
# try_files fallback below, a hard refresh (or a shared link) to any
# non-root route like /tokens or /mint/buy/<id> would 404 at the nginx
# layer before React Router ever gets a chance to render it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Local runs need PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest — `web3` ships a
# pytest plugin that pytest auto-loads via setuptools entry points and that
# plugin is broken against the eth-typing version requirements.txt resolves
# (ImportError: cannot import name 'ContractName'), crashing pytest before
# any test even runs. See .github/workflows/ci.yml for the same env var.
[pytest]
testpaths = tests
# Without this, pytest's default import mode never puts backend/ itself on
# sys.path (only tests/, since conftest.py has no __init__.py) — `from app
# import create_app` would fail with ModuleNotFoundError. `.` is resolved
# relative to this file's directory (backend/).
pythonpath = .

# Foundry tests for the Bonding-Curve Token template — how to run: render.py.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.19"
evm_version = "paris"
# Same compiler settings as the backend (services/solidity.py).
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../../../frontend/node_modules/@uniswap" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 60
fail_on_revert = false

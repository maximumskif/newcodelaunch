# Foundry tests for the Bonding-Curve Token template — how to run: render.py.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.19"
evm_version = "paris"
optimizer = false
fs_permissions = [{ access = "read", path = "../../../frontend/node_modules/@uniswap" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 60
fail_on_revert = false
